[package]
name = "codex-appserver-ctl"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Manage Codex profiles, daemons, SSH targets, updates, and local usage"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
tempfile = "3"
glob = "0.3"
